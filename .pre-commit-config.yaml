repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.6
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: pretty-format-json
        args: ['--autofix', '--no-sort-keys']
        types: [json]
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: build
        name: build
        entry: cargo build --verbose
        language: rust
        pass_filenames: false
      - id: fmt
        name: fmt
        entry: cargo fmt --all -- --check
        language: rust
        pass_filenames: false
      - id: test
        name: test
        entry: cargo test
        language: rust
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: cargo clippy -- -D warnings
        language: rust
        pass_filenames: false
      - id: repo-map
        name: repo_map
        entry: uv run -m repo_mapper
        language: system
        pass_filenames: false
        args:
          - --repo-root
          - .
          - --readme-path
          - ./README.md
          - --gitignore-path
          - ./.gitignore
          - --allowed-exts
          - py,rs,md,yaml,toml,lock
          - --ignore-dirs
          - .venv,target,.git,mock_data
          - --dirs-only
